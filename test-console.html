<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chatbot Router — Test Console</title>
<style>
  :root {
    --bg: #f5f5f3;
    --card: #ffffff;
    --border: #e0ddd4;
    --text: #2c2c2a;
    --text-muted: #6b6a64;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --success: #0f6e56;
    --success-bg: #e1f5ee;
    --warn: #854f0b;
    --warn-bg: #faeeda;
    --danger: #a32d2d;
    --danger-bg: #fcebeb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    line-height: 1.5;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }

  .config-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .config-panel summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .config-row { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .config-row label { font-size: 12px; color: var(--text-muted); }
  .config-row input {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: monospace;
  }

  .chat-log { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .bubble.user {
    background: var(--accent-bg);
    border-color: var(--accent-bg);
    align-self: flex-end;
    max-width: 80%;
    color: #0c447c;
  }
  .bubble-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 6px; }
  .bubble.user .bubble-label { color: #185fa5; }

  .status-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .status-pill.complete, .status-pill.answered { background: var(--success-bg); color: var(--success); }
  .status-pill.incomplete { background: var(--warn-bg); color: var(--warn); }
  .status-pill.needs_ticket { background: var(--warn-bg); color: var(--warn); }
  .status-pill.error { background: var(--danger-bg); color: var(--danger); }

  .leg-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    background: #fafaf8;
  }
  .leg-card .field { font-size: 13px; margin: 2px 0; }
  .leg-card .field b { color: var(--text-muted); font-weight: 600; margin-right: 4px; }

  .followup-question {
    font-size: 15px;
    font-weight: 600;
    margin-top: 6px;
  }

  details.raw-json {
    margin-top: 10px;
    font-size: 12px;
  }
  details.raw-json summary {
    cursor: pointer;
    color: var(--text-muted);
    user-select: none;
  }
  details.raw-json pre {
    background: #1e1e1c;
    color: #d4d4d0;
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin-top: 8px;
    font-family: "SF Mono", monospace;
    font-size: 12px;
  }

  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
  }
  .input-row button {
    padding: 12px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-row button:disabled { background: #b4b2a9; cursor: not-allowed; }
  .input-row button:hover:not(:disabled) { background: #0c447c; }

  .followup-banner {
    background: var(--warn-bg);
    color: var(--warn);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 10px;
    display: none;
  }
  .followup-banner.active { display: block; }

  .reset-link {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Chatbot router — test console</h1>
  <p class="subtitle">Formatted view by default — expand "View raw JSON" on any message to see the exact API response.</p>

  <details class="config-panel" open>
    <summary>Connection settings</summary>
    <div class="config-row">
      <label for="endpoint">Function base URL (e.g. http://localhost:7071 or https://your-app.azurewebsites.net)</label>
      <input id="endpoint" type="text" value="http://localhost:7071" />
    </div>
    <div class="config-row">
      <label for="funcKey">Function key (leave blank for anonymous/local)</label>
      <input id="funcKey" type="text" placeholder="optional" />
    </div>
  </details>

  <div class="followup-banner" id="followupBanner">
    Waiting on your answer to continue this travel request — just reply below.
    <button class="reset-link" onclick="resetConversation()" style="margin-left:8px;">Start over instead</button>
  </div>

  <div class="chat-log" id="chatLog"></div>

  <div class="input-row">
    <input id="messageInput" type="text" placeholder="Type a question, e.g. Business trip to Cuba with client, 26 Aug 2026 to 24 Sep 2026" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let pendingResponse = null; // the previous_response we carry for travel follow-ups

function resetConversation() {
  pendingResponse = null;
  document.getElementById('followupBanner').classList.remove('active');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addUserBubble(text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'bubble user';
  div.innerHTML = `<div class="bubble-label">You</div>${escapeHtml(text)}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function renderTravelExtracted(extracted) {
  let html = '';
  (extracted || []).forEach((leg) => {
    html += `<div class="leg-card">
      <div class="field"><b>Destination:</b> ${escapeHtml(leg.destinationCountry || '—')}</div>
      <div class="field"><b>Dates:</b> ${escapeHtml(leg.startDate || '—')} to ${escapeHtml(leg.endDate || '—')}</div>
      <div class="field"><b>Reason:</b> ${escapeHtml(leg.reason || '—')}</div>
    </div>`;
  });
  return html;
}

function renderBotBubble(responseJson) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'bubble';

  const status = responseJson.status || 'error';
  let inner = `<div class="bubble-label">Assistant</div>`;
  inner += `<span class="status-pill ${status}">${status.replace('_', ' ')}</span><br/>`;

  if (responseJson.belongto === 'travel_request') {
    if (status === 'complete') {
      inner += `<div>Travel request complete:</div>`;
      inner += renderTravelExtracted(responseJson.extracted);
    } else if (status === 'incomplete') {
      inner += `<div class="followup-question">${escapeHtml(responseJson.follow_up_question)}</div>`;
      inner += renderTravelExtracted(responseJson.extracted);
    } else if (status === 'error') {
      inner += `<div>${escapeHtml(responseJson.message || 'An error occurred.')}</div>`;
    }
  } else if (responseJson.belongto === 'helpdesk') {
    inner += `<div>Tagged as help-desk. Question passed through: <em>${escapeHtml(responseJson.question || '')}</em></div>`;
  } else {
    inner += `<div>${escapeHtml(responseJson.message || 'An error occurred.')}</div>`;
  }

  inner += `<details class="raw-json"><summary>View raw JSON</summary><pre>${escapeHtml(JSON.stringify(responseJson, null, 2))}</pre></details>`;

  div.innerHTML = inner;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;

  const endpoint = document.getElementById('endpoint').value.replace(/\/$/, '');
  const funcKey = document.getElementById('funcKey').value.trim();
  const url = endpoint + '/api/classify' + (funcKey ? ('?code=' + encodeURIComponent(funcKey)) : '');

  addUserBubble(text);
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  const body = { text: text };
  if (pendingResponse) {
    body.previous_response = pendingResponse;
  }

  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const json = await resp.json();
    renderBotBubble(json);

    if (json.belongto === 'travel_request' && json.status === 'incomplete') {
      pendingResponse = json;
      document.getElementById('followupBanner').classList.add('active');
    } else {
      pendingResponse = null;
      document.getElementById('followupBanner').classList.remove('active');
    }
  } catch (err) {
    const log = document.getElementById('chatLog');
    const div = document.createElement('div');
    div.className = 'bubble';
    div.innerHTML = `<div class="bubble-label">Error</div><div>${escapeHtml(err.message)}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">
      If this is a CORS error, enable CORS on your Function App (or run <code>func start --cors *</code> locally).
      </div>`;
    log.appendChild(div);
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

document.getElementById('messageInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
